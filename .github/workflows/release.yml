name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  # Re-run a release for an existing tag, e.g. one whose release was published
  # by hand from the GitHub UI before the assets were built.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.1.0)
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Create one draft release up front so the platform jobs below all upload
  # to it, instead of racing each other to create it.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Do not create a release from a commit that fails lint or tests.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # electron-builder names the release after package.json's version, not
      # the pushed tag; a mismatch would otherwise publish nothing and pass.
      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version ($expected)"
            exit 1
          fi

      - name: Create draft release
        run: |
          # This version's CHANGELOG.md section, used as the release notes.
          awk -v v="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          notes=(--generate-notes)
          if grep -q '[^[:space:]]' release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG.md section for ${TAG#v}; using generated notes"
          fi

          if state=$(gh release view "$TAG" --json isDraft,assets \
                       --jq '"\(.isDraft) \(.assets | length)"' 2>/dev/null); then
            read -r is_draft asset_count <<< "$state"
            if [ "$is_draft" = "true" ]; then
              echo "Reusing existing draft release $TAG"
            elif [ "$asset_count" = "0" ]; then
              # Published by hand (e.g. from the GitHub UI) before anything was
              # built: turn it back into a draft so the jobs below can fill it.
              echo "::notice::Release $TAG was published with no assets; reverting it to a draft to build them"
              if [ "${notes[0]}" = "--notes-file" ]; then
                gh release edit "$TAG" --draft=true --notes-file release-notes.md
              else
                gh release edit "$TAG" --draft=true
              fi
            else
              echo "::error::Release $TAG is already published with assets; bump the version instead"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" "${notes[@]}"
          fi

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and upload to the draft release
        run: npx electron-builder --${{ matrix.platform }} --publish always

  # Publish only once every platform has uploaded its assets.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
