name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in src/main/*.js src/preload.cjs src/renderer/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Check paths in the electron-builder config
        run: node scripts/check-build-config.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Disk monitor smoke test
        run: node scripts/smoke-monitor.mjs

      # A real Linux target (not just --dir), so icon and packaging problems
      # show up here rather than in the release build.
      - name: Package (Linux AppImage)
        run: npx electron-builder -l AppImage --publish never

  # Run the real disk monitor backend (iostat on macOS, typeperf on Windows)
  # for a few seconds and check the parsers get samples. Linux runs the same
  # script in the build job above.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # The monitor has no dependencies, so there is nothing to install.
      - name: Disk monitor smoke test
        run: node scripts/smoke-monitor.mjs

  # The release builds one universal (x64 + arm64) macOS app. Merging the two
  # architectures needs lipo, which only exists on macOS, so build the same
  # targets here, without publishing, and check the result has both.
  package-mac:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (macOS dmg and zip, universal)
        run: npx electron-builder --mac --publish never

      - name: Check the app is universal
        run: |
          set -euo pipefail
          archs=$(lipo -archs "dist/mac-universal/Mac Disk Sounds.app/Contents/MacOS/Mac Disk Sounds")
          echo "Architectures: $archs"
          [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]]
          test -f "dist/mac-universal/Mac Disk Sounds.app/Contents/Resources/icon.icns"
          ls -l dist/*.dmg dist/*.zip

      # PR builds are unsigned; report the signature state without failing,
      # so a broken merge shows up here before users hit it on Apple silicon.
      - name: Report code signature (informational)
        continue-on-error: true
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Mac Disk Sounds.app"
