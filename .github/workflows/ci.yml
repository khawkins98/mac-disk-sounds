name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in src/main/*.js src/preload.cjs src/renderer/*.js; do
            node --check "$file"
          done

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package (Linux, unpacked)
        run: npx electron-builder --dir -l --publish never
